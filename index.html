<!DOCTYPE html>
<html lang="ar-TN" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070d24" />
  <title>CISTAC 2.0 · دينار دينار</title>
  <meta name="description" content="دينار دينار نلمو حق Cistac 2.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <main class="app">
    <!-- Logos -->
    <header class="logos">
      <div class="logo">
        <img src="assets/ieee-epi-sb.png" alt="IEEE EPI SB" />
        <span class="logo-fallback">IEEE EPI SB</span>
      </div>
      <div class="logo">
        <img src="assets/ieee-epi-cis-sbc.png" alt="IEEE EPI CIS SBC" />
        <span class="logo-fallback">IEEE EPI CIS SBC</span>
      </div>
    </header>

    <!-- Title -->
    <h1 class="title">
      دينار دينار<br />
      نلمّو حق <span class="brand">Cistac</span>
    </h1>
    <p class="sub">كل دينار يفرق، ساهم معانا في <b>CISTAC 2.0</b> 💙</p>

    <!-- Counter -->
    <section class="counter" aria-live="polite">
      <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="55%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#c084fc" />
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="110" cy="110" r="96" />
        <circle id="ringFill" class="ring-fill" cx="110" cy="110" r="96" />
      </svg>
      <div class="counter-inner">
        <div class="count"><span id="countNow">0</span><span class="slash">/</span><span id="countGoal">15000</span></div>
        <div class="unit">دينار</div>
        <div class="pct" id="pct">0%</div>
      </div>
    </section>

    <p class="remaining" id="remaining">باقي 15000 دينار باش نوصلو للهدف</p>

    <button id="donateBtn" class="donate">
      <span>تبرع</span>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 5 6.4 5c2 0 3.5 1 4.6 2.5C12.1 6 13.6 5 15.6 5 19 5 21.1 8.3 19.6 11.8 19.5 11.9 12 21 12 21z"/></svg>
    </button>

    <!-- History -->
    <section class="history">
      <h2>آخر المتبرعين <span class="badge" id="donorCount">0</span></h2>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty">ما فما حتى تبرع للآن، كون إنت الأول! 🚀</p>
    </section>

    <footer class="foot">صُنع بـ 💙 من فريق IEEE EPI SB</footer>
  </main>

  <!-- Donation modal -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <button class="close" id="closeBtn" aria-label="سكر">✕</button>
      <h3 id="mTitle">يعطيك الصحة على تبرعك 🙏</h3>
      <form id="form" novalidate>
        <label for="name">شنوة اسمك؟</label>
        <input id="name" type="text" maxlength="30" placeholder="مثلا: محمد" autocomplete="name" required />

        <label for="amount">قداش تحب تتبرع؟ (بالدينار)</label>
        <input id="amount" type="number" inputmode="numeric" min="1" max="15000" step="1" placeholder="مثلا: 10" required />

        <div class="chips" id="chips">
          <button type="button" data-v="5">5</button>
          <button type="button" data-v="10">10</button>
          <button type="button" data-v="20">20</button>
          <button type="button" data-v="50">50</button>
        </div>

        <p class="error" id="error" role="alert"></p>
        <button type="submit" class="submit" id="submitBtn">ابعث التبرع</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <canvas id="confetti"></canvas>

  <script type="module" src="app.js"></script>
</body>
</html>
